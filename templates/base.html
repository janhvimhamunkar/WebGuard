<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}WebGuard{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head><body>
<nav class="navbar navbar-expand-md wg-nav no-print"><div class="container">
  <a class="navbar-brand" href="{{ url_for('index') }}"><i class="bi bi-shield-check"></i> Web<span>Guard</span></a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv"><i class="bi bi-list text-dark"></i></button>
  <div class="collapse navbar-collapse" id="nv"><ul class="navbar-nav ms-auto">
    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('scanner_page') }}">Scanner</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('history') }}">Scan History</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
  </ul></div>
</div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<footer class="text-center text-secondary small py-4 no-print">WebGuard is an educational tool. Only scan websites you own or are explicitly authorized to test.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body></html>
