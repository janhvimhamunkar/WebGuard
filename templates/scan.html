{% extends "base.html" %}{% block title %}Scanner - WebGuard{% endblock %}{% block content %}
<div class="mx-auto" style="max-width:720px"><div class="card wg-card"><div class="card-body p-4">
  <h2><i class="bi bi-radar accent"></i> Website Security Scanner</h2>
  <p class="text-secondary">Passive scan of the single URL you submit. No forms are submitted, no scripts executed, nothing is modified.</p>
  <div id="err" class="alert alert-danger d-none"></div>
  <div id="scanForm">
    <label class="form-label" for="url">Target URL</label>
    <input id="url" class="form-control form-control-lg wg-input mb-3" placeholder="https://example.com" autocomplete="off">
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="auth">
      <label class="form-check-label" for="auth">I confirm that I own this website or have authorization to perform this security assessment.</label>
    </div>
    <button id="scanBtn" class="btn btn-wg btn-lg w-100" disabled><i class="bi bi-search"></i> Scan</button>
  </div>
  <div id="loading" class="text-center d-none py-4"><div class="spinner-border text-primary mb-3"></div><p class="mb-0">Initializing Security Assessment...</p></div>
</div></div></div>{% endblock %}
